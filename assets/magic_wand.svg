<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <defs>
    <!-- Wand Stem Gradient -->
    <linearGradient id="wandHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="45%" stop-color="#FF7597"/>
      <stop offset="100%" stop-color="#7052FF"/>
    </linearGradient>
    <!-- Star Gradient -->
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFF176"/>
      <stop offset="75%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </radialGradient>
    <!-- Soft Glow Filter -->
    <filter id="wandGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#wandGlow)">
    <!-- Wand Shaft Base & Shading -->
    <line x1="12" y1="12" x2="38" y2="38" stroke="#331442" stroke-width="6" stroke-linecap="round"/>
    <line x1="12" y1="12" x2="38" y2="38" stroke="url(#wandHandle)" stroke-width="4" stroke-linecap="round"/>
    <!-- Swirl Ribbon Highlight -->
    <path d="M 16 16 Q 19 15 20 20 T 27 27 T 34 34" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>

    <!-- Radiant Magic Star Tip (Hotspot at 9, 1) -->
    <polygon points="9,1 12,6.5 18,7.5 13.5,12.5 15,18.5 9,15 3,18.5 4.5,12.5 0,7.5 6,6.5" fill="url(#starGrad)" stroke="#E65100" stroke-width="0.8"/>

    <!-- Star Highlights -->
    <circle cx="9" cy="9" r="2.2" fill="#FFFFFF"/>
    <circle cx="19" cy="3" r="1.3" fill="#FFF9C4"/>
    <circle cx="1" cy="19" r="1.1" fill="#4DD0E1"/>
    <circle cx="21" cy="15" r="0.9" fill="#FF80AB"/>
  </g>
</svg>
